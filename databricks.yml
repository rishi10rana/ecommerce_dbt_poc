# Databricks Asset Bundles (Github CI / CD)
bundle:
  name: ecommerce_dbt_dab

# INCLUDE — tells DAB to pull in all job YAMLs from resources/
include:
  - resources/jobs/*.yml
  - resources/*.yml

variables:
    warehouse_id:
      description: "Serverless Starter Warehouse ID"
      default: "737d0afc3b2dcc10"
    
    catalog:
      description: "Unity Catalog catalog name for this target"
      default: "dbt" # overridden per target below
    
    schema:
      description: "Base schema for this target"
      default: "dbt_dev"

    dbt_target:
      description: "dbt target to run against (dev / qa / prod)"
      default: "dev"  
    
    dbt_threads:
      description: "Number of parallel dbt threads"
      default: "4"

workspace:
  host: https://dbc-0e9a0add-0993.cloud.databricks.com/
  root_path: "~/.bundle/${bundle.name}/${bundle.target}"

sync:
  exclude:
    - .git/**
    - dbt_packages/**
    - logs/**
    - target/**

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: "dbt_ecommerce_dev_version2"
      dbt_target: "dev"
      dbt_threads: "4"
      schema: "dbt_dev"

  prod:
    mode: production
    variables:
      catalog: "dbt_ecommerce_prod_version2"
      dbt_target: "prod"
      dbt_threads: "8"
      schema: "dbt_prod"
    workspace:
      # Production MUST use explicit absolute path (no ~ shortcut)
      # This guarantees only ONE prod deployment ever exists
      root_path: /Workspace/Users/ranarishi298@gmail.com/.bundle/${bundle.name}/${bundle.target}
    resources:
      jobs:
        ecommerce_bronze_hourly:
          schedule:
            pause_status: UNPAUSED

        ecommerce_daily_pipeline:
          schedule:
            pause_status: UNPAUSED