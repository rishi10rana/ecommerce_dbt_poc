# Job 2: Daily Full Pipeline
resources:
  jobs:
    ecommerce_daily_pipeline:
      name: "[${bundle.target}] Ecommerce - Daily Full Pipeline"
      tags:
        team: "data-engineering"
        project: "ecommerce_dbt_poc"

      queue:
        enabled: true
      
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - dbt-databricks>=1.9.0

      performance_target: PERFORMANCE_OPTIMIZED

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"    # 2:00 AM every day
        timezone_id: "Asia/Kolkata"
        pause_status: PAUSED
      
      email_notifications:
        on_failure:
          - "ranarishi298@gmail.com"
      
      tasks:
        - task_key: dbt_seed
          dbt_task:
            project_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            # profiles_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            commands:
              - "dbt deps"
              - "dbt seed --target ${var.dbt_target}"
            warehouse_id: "${var.warehouse_id}"
            catalog: "${var.catalog}"
          environment_key: default
          
        # Task 1: Bronze
        - task_key: dbt_bronze_run
          depends_on:
            - task_key: dbt_seed
          dbt_task:
            project_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            # profiles_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            commands:
              - "dbt run --select tag:layer_bronze --target ${var.dbt_target} --profiles-dir /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/"
              - "dbt test --select tag:layer_bronze --target ${var.dbt_target} --profiles-dir /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/"
            warehouse_id: "${var.warehouse_id}"
            catalog: "${var.catalog}"
          environment_key: default

        # Task 2: Silver (depends on seed)
        - task_key: dbt_silver_run
          depends_on:
            - task_key: dbt_bronze_run
          dbt_task:
            project_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            # profiles_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            commands:
              - "dbt run --select tag:layer_silver --target ${var.dbt_target} --profiles-dir /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/"
              - "dbt test --select tag:layer_silver --target ${var.dbt_target} --profiles-dir /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/"
            warehouse_id: "${var.warehouse_id}"
            catalog: "${var.catalog}"
          environment_key: default

        # Task 3: Gold (depends on silver)
        - task_key: dbt_gold_run
          depends_on:
            - task_key: dbt_silver_run
          dbt_task:
            project_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            # profiles_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            commands:
              - "dbt run --selector gold_only --target ${var.dbt_target} --profiles-dir /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/"
              - "dbt test --selector gold_only --target ${var.dbt_target} --profiles-dir /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/"
            warehouse_id: "${var.warehouse_id}"
            catalog: "${var.catalog}"
          environment_key: default

        # ── Task 4: Snapshots (depends on silver, runs parallel to gold) ─
        - task_key: dbt_snapshot
          depends_on:
            - task_key: dbt_silver_run  
          dbt_task:
            project_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            # profiles_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            commands:
              - "dbt snapshot --target ${var.dbt_target} --profiles-dir /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/"
            warehouse_id: "${var.warehouse_id}"
            catalog: "${var.catalog}"
          environment_key: default