# Job 3: CI Validation Job
# this job is triggered manually by Github Actions on PR
resources:
  jobs:
    ecommerce_ci_validation:
      name: "[${bundle.target}] ecommerce - CI Validation (PR Check)"
      tags:
        team: "data-engineering"
        type: "ci"
        project: "ecommerce_dbt_poc"

      queue:
        enabled: true
    
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - dbt-databricks>=1.9.0

      performance_target: PERFORMANCE_OPTIMIZED
      tasks:
        - task_key: dbt_compile_check
          dbt_task:
            project_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            # profiles_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            commands:
              - "dbt deps"
              - "dbt compile"
            warehouse_id: "${var.warehouse_id}"
            catalog: "${var.catalog}"
          environment_key: default

        - task_key: dbt_run_modified
          depends_on:
            - task_key: dbt_compile_check
          dbt_task:
            project_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            # profiles_directory: /Workspace/Users/${workspace.current_user.userName}/.bundle/ecommerce_dbt_dab/${bundle.target}/files/
            commands:
              # Slim CI: only run models that changed vs prod manifest
              # If no manifest exists, runs all models (safe fallback)
              - "dbt run"
              - "dbt test"
            warehouse_id: "${var.warehouse_id}"
            catalog: "${var.catalog}"
          environment_key: default