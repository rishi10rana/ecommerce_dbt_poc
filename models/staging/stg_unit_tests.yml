version: 2
unit_tests:
    - name: test_stg_customers_sanitized_logic
      model: stg_customers_sanitized
      description: "Verify email cleaning, domain parsing"

      # mock input in place of brz_customers
      given:
        - input: ref('brz_customers')
          rows:
            - {customer_id: 1, first_name: 'John', last_name: 'Doe', email: '  JOHN.DOE@GMAIL.COM '}
            - {customer_id: 2, first_name: 'Jane', last_name: 'Smith', email: 'jane@yahoo.com'}
            - {customer_id: 3, first_name: 'Bob', last_name: 'Taylor', email: 'bob@company.org'}
            - {customer_id: 4, first_name: 'Alice', last_name: 'Wong', email: 'alice@outlook.com'}
        
      expect:
        rows:
          - {customer_id: 1, first_name: 'John', last_name: 'Doe', clean_email: 'john.doe@gmail.com',  email_provider: 'Gmail'}
          - {customer_id: 2, first_name: 'Jane', last_name: 'Smith', clean_email: 'jane@yahoo.com',      email_provider: 'Yahoo'}
          - {customer_id: 3, first_name: 'Bob', last_name: 'Taylor', clean_email: 'bob@company.org',     email_provider: 'Corporate/Other'}
          - {customer_id: 4, first_name: 'Alice', last_name: 'Wong', clean_email: 'alice@outlook.com',   email_provider: 'Outlook'}