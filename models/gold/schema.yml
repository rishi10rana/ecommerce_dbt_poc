version: 2
models:
  - name: dim_customers
    description: "Conformed customer dimension"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - valid_email
  
  - name: fct_orders
    description: "Order fact table"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: ['PENDING', 'PROCESSING', 'SHIPPED', 'DELIVERED', 'CANCELLED', 'RETURNED']
              quote: true
      - name: gross_order_revenue
        tests:
          - not_null
          - not_negative
          
  - name: dim_products
    tests:
      # Table-level expectations: row count must be b/w 100 and 500
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 100
          max_value: 500
    columns:
      - name: unit_price
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0.01
              max_value: 10000.00
  
  - name: mart_promo_effectiveness
    columns:
      - name: promotion_id
        tests:
          - unique
          - not_null
      - name: discount_rate_pct
        tests:
          - not_negative

  - name: mart_sales_daily_summary
    description: "Daily sales summary combining orders and payment - Gold mart layer"
    columns:
      - name: order_day
        description: "The calender date of the orders"
        tests:
          - not_null
          - unique
      - name: total_orders
        description: "Total number of non-cancelled orders on this day"
        tests:
          - not_null
      - name: gross_revenue
        description: "Sum of total_amount for non-cancelled orders"
      - name: collection_rate_pct
        description: "Percentage of gross revenue actually collected via payments"
          