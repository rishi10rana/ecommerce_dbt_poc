version: 2

exposures:
    # this is a power BI dashboard
    - name: exec_marketing_dashboard
      label: Executive Marketing and ROI Dashboard
      type: dashboard
      url: https://app.powerbi.com/groups/shopstream/reports/exec-marketing
      description: >
        This dashboard is used by the Chief Marketing Officer to track the ROI of 
        all promotional campaigns, discount rates, and net revenue generation.
        It refreshes daily.
      maturity: high
      owner:
        name: Data Engineering Team
        email: ranarishi298@gmail.com
    
      # linking our dashboard to our dbt models
      depends_on:
        - ref('mart_promo_effectiveness')
        - ref('dim_date')
    
    # a databricks machine learning 
    - name: ml_churn_prediction_model
      label: ML Customer Churn Predictor
      type: ml
      url: https://databricks.com/workspace/models/churn-predictor
      description: >
        Databricks ML model that runs weekly to predict which customers are 
        most likely to churn based on their lifetime value and recent orders.
      maturity: medium
      owner:
        name: Rishi Rana
        email: rishi.rana@celebaltech.com
      depends_on:
        - ref('dim_customers')
      